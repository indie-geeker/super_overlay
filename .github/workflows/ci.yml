name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter stable release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: flutter analyze

      - name: Check patch whitespace
        run: git diff --check

      - name: Inspect dependency graph
        run: flutter pub deps --style=compact

      - name: Check repository contracts
        run: flutter test test/repository_contract_test.dart

      - name: Check back dispatch contract
        run: flutter test test/super_overlay_back_dispatch_test.dart

      - name: Check host ownership contract
        run: flutter test test/super_overlay_host_ownership_test.dart

      - name: Check ShellRoute contract
        run: flutter test test/super_overlay_shell_route_test.dart

      - name: Test package with reproducible randomized ordering
        run: flutter test --test-randomize-ordering-seed=20260713

      - name: Test package with coverage
        run: flutter test --coverage

      - name: Enforce coverage threshold
        run: |
          awk -F: '/^LH:/{hit+=$2} /^LF:/{found+=$2} END{if (found == 0) { print "coverage=missing"; exit 2 } coverage=hit*100/found; printf "hit=%d found=%d coverage=%.3f%%\n", hit, found, coverage; exit coverage < 90}' coverage/lcov.info

      - name: Check API docs
        run: dart doc --dry-run

      - name: Check publish readiness
        run: flutter pub publish --dry-run

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Build example web
        working-directory: example
        run: flutter build web

  flutter-minimum:
    name: Flutter 3.29 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.29.0"
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze

      - name: Test package
        run: flutter test

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test
